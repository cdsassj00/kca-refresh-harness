# 결론 판정 어휘와 수치 규칙. 비교기가 원 결론(K)·추적 재도출(K')·블라인드(K'')를 놓고 적용한다.
verdicts:
  - {name: 동일, rule: 방향 동일 + 수치 오차 same_within_pct 이내 + 블라인드도 같은 방향}
  - {name: 강화, rule: 방향 동일 + 근거 등급 상승 또는 효과 크기 증가 ≥ strengthen_pct}
  - {name: 부분수정, rule: 방향 동일 + 오차 same_within_pct 초과 ~ partial_within_pct 이내, 또는 조건·범위 변경}
  - {name: 약화, rule: 방향 동일 + 근거 등급 하락 또는 효과 크기 감소 ≥ strengthen_pct}
  - {name: 뒤집힘, rule: 부호·방향 반전, 또는 제언이 반대 정책으로 대체}
  - {name: 신규결론, rule: 원 연구에 없던 결론이 K' 또는 K''에서 A/B 근거로 도출}
  - {name: 판정불가, rule: 근거 E를 재수집할 수 없음(설문·실험·실측 필요) → R3, 설계서 첨부}

# 유형을 알 수 없거나 by_type에 없는 결론에만 쓰는 기본값(fallback).
# 유형이 있으면 반드시 by_type 쪽을 먼저 적용한다.
numeric_rules:
  same_within_pct: 10
  partial_within_pct: 30
  strengthen_pct: 20

# ---------------------------------------------------------------------------
# 연구유형별 판정 기준. 유형 코드는 templates/taxonomy.yaml 과 같다(F/M/S/P/T/B/G).
# 결론의 types(03_argument_chains.json 의 conclusions[].types)에 따라 고른다.
# mode 는 그 유형을 무엇으로 재는지를 말한다.
#   numeric_error            오차율(%)로 잰다
#   numeric_with_sensitivity 오차율 + 민감도(부호·순위 유지)로 잰다
#   state                    퍼센트가 아니라 상태표로 잰다
#   substitute_or_redesign   동등 조사로 대체되면 수치, 아니면 판정불가
#   standard_tracking        표준·규격의 변경 여부로 잰다
#   case_validity_ratio      사례가 아직 유효한 비율로 잰다
#   kpi_attainment           KPI 달성도로 잰다
# ---------------------------------------------------------------------------
by_type:

  F:
    name: 전망·예측형
    mode: numeric_error
    metric: MAPE                      # 오차율 = |예측값 − 실적값| / 실적값 × 100
    horizon_years: 5                  # 이 값 이하면 horizons.short, 초과하면 horizons.long
    same_within_pct: 10               # 유형 기본값 = 단기·중기 기준
    partial_within_pct: 20
    strengthen_pct: 20
    rationale: "전망은 실적이 나오므로 예측 오차율로 잰다. Lewis(1982, p.40)의 MAPE 해석표(<10 매우 정확, 10~20 좋음, 20~50 무난, >50 부정확)를 그대로 판정 눈금으로 쓴다. 표 자체의 기본값은 단기·중기 기준이며 예측시계가 horizon_years를 넘으면 horizons.long을 적용한다."
    source_url: https://www.psicothema.com/pdf/4144.pdf
    horizons:
      - id: short
        label: 단기·중기 전망(예측시계 5년 이하)
        max_horizon_years: 5
        same_within_pct: 10
        partial_within_pct: 20
        strengthen_pct: 20
        rationale: "Lewis(1982, p.40)에서 MAPE 10% 미만은 '매우 정확한 예측', 10~20%는 '좋은 예측'이다. 그래서 오차 10% 이내를 동일, 20% 이내를 부분수정으로 둔다. 20% 초과는 방향에 따라 강화·약화, 부호가 뒤집히면 뒤집힘."
        source_url: https://www.psicothema.com/pdf/4144.pdf
      - id: long
        label: 중장기 전망(예측시계 5년 초과)
        max_horizon_years: null
        same_within_pct: 20
        partial_within_pct: 50
        strengthen_pct: 30
        rationale: "예측 오차는 예측시계가 길수록 커진다는 것이 M-경진대회 이래 예측 문헌의 일관된 관찰이다. 그래서 중장기에는 Lewis 눈금을 한 칸씩 내려 '좋은 예측'(20%)까지 동일, '무난한 예측'(50%)까지 부분수정으로 본다. 눈금 자체는 Lewis, 한 칸 내리는 폭은 하네스의 판단이다."
        source_url: https://arxiv.org/abs/2012.03854
    notes:
      - 오차율의 분모는 실적값이다. 실적이 없으면 F 기준을 쓸 수 없고 판정불가로 간다.
      - 시나리오(High/Medium/Low)가 있으면 Medium(중심값) 기준으로 재고, 실적이 밴드 안에 들어오면 reason에 적는다.

  M:
    name: 경제성·계량분석형
    mode: numeric_with_sensitivity
    metric: 점추정 오차율 + 민감도
    same_within_pct: 15
    partial_within_pct: 40
    strengthen_pct: 25
    rationale: "경제성 분석의 값은 할인율·단가·수요량 같은 가정에 끌려다니므로 점추정 오차만으로 판정하면 가정 하나에 결론이 흔들린다. 그래서 오차 눈금은 F보다 넓게 두고(15/40), 진짜 기준은 sign_stability(부호·순위가 유지되는가)에 둔다. 15·40이라는 숫자 자체는 잠정값 — 근거 미확보."
    source_url: https://www.adb.org/sites/default/files/page/149401/sensitivity-risk-analysis-feb2011.pdf
    sign_stability:
      shock_pct: 20
      params: 핵심 파라미터(할인율·단가·수요량·편익계수·투자비 등)를 하나씩
      rule: 핵심 파라미터를 각각 ±shock_pct 흔들어도 결론의 부호(편익>비용, NPV>0 등)와 대안 순위가 유지되면, 점추정 오차가 same_within_pct를 넘어도 "동일"로 본다.
      switching_value_rule: 전환값(NPV를 0으로 만드는 변화율)의 절댓값이 shock_pct보다 크면 부호가 안정한 것으로 본다.
      pass_verdict: 동일
      fail_verdict: 부분수정
      sign_flip_verdict: 뒤집힘
      unavailable_verdict: 판정불가
      rationale: "ADB의 민감도·위험 분석 지침은 전환값(switching value)을 '투자 판단을 바꾸는 변수 값, 보통 기준값 대비 변화율'로 정의하고, 실무에서 쓰이는 표준 충격폭을 ±10%(20%)로 기록한다. 그중 넓은 쪽인 20%를 채택해, 20% 충격에도 부호·순위가 버티면 결론이 살아 있다고 본다."
      source_url: https://www.adb.org/sites/default/files/page/149401/sensitivity-risk-analysis-feb2011.pdf
    notes:
      - 수식·가정을 복원하지 못해 재계산이 불가능하면 오차 눈금을 쓰지 말고 판정불가로 둔다.
      - 민감도 표(파라미터별 ±20% 결과)를 reason 또는 L1/model_rerun.json 에 남긴다.

  P:
    name: 정책·제도형
    mode: state
    percent_based: false
    rationale: "정책 제언은 '몇 % 틀렸나'로 잴 수 없다. 채택·입법·시행이라는 상태가 곧 판정이므로 수치 임계값 대신 상태표를 쓴다. 상태 분류는 taxonomy.yaml 의 P 전략(채택·입법·시행 추적 → 유효성 → 유지/수정/폐기/신규)을 판정 어휘에 맞춰 옮긴 것이다."
    states:
      - state: 채택·시행 완료
        verdict: 동일
        next_action: 유지
        test: 제언이 법령·고시·계획·예산으로 반영되어 시행 중이다.
      - state: 채택 후 확대·상위 법제화
        verdict: 강화
        next_action: 유지
        test: 제언이 시행을 넘어 상위 법령으로 올라갔거나 적용 범위가 넓어졌다.
      - state: 일부 채택·수정 시행
        verdict: 부분수정
        next_action: 부록 갱신
        test: 제언의 일부만 반영되었거나, 내용이 바뀐 채로 시행 중이다(계류·입법예고 포함).
      - state: 미채택이나 전제 유효
        verdict: 약화
        next_action: 재연구 발주
        test: 채택되지 않았으나 제언이 겨냥한 문제와 전제는 아직 살아 있다.
      - state: 전제 소멸·반대 정책 시행
        verdict: 뒤집힘
        next_action: 폐기(아카이브)
        test: 제언의 전제가 사라졌거나, 반대 방향 정책이 시행되었다.
      - state: 추적 불가
        verdict: 판정불가
        next_action: 추가 조사(설계서)
        test: 채택 여부를 공개 자료로 확인할 수 없다.
    notes:
      - 상태 판정에는 법령·고시·회의록·예산서 등 A등급 1차 근거를 붙인다. B등급만 있으면 reason에 명시한다.

  S:
    name: 실태조사형
    mode: substitute_or_redesign
    rationale: "설문·실태조사는 하네스가 다시 수행하지 않는다. 그래서 먼저 '같은 것을 재는 최신 공식조사가 있는가'를 묻고, 있으면 그 수치로 F 기준을 준용해 재고, 없으면 임계값을 억지로 만들지 않고 판정불가로 둔 뒤 재설문 설계서를 붙인다."
    substitute_available:
      apply_type: F
      verdict_source: F 유형의 오차율 기준을 그대로 준용한다(예측시계가 없으므로 horizons.short 적용).
      rationale: "동등 조사가 있으면 그 결과는 '실적'과 같은 지위를 가지므로 F의 오차 눈금을 그대로 쓸 수 있다."
    substitute_unavailable:
      verdict: 판정불가
      next_action: 추가 조사(설계서)
      artifact: L3/survey_redesign_<K-ID>.md
      rationale: "원 조사와 동등한 최신 조사가 없으면 수치 비교 자체가 성립하지 않는다. 합성 시뮬레이션은 C등급 참고치일 뿐 판정 근거가 되지 못한다."
    equivalence_checks: [모집단, 표집틀·표본크기, 문항 문구, 척도, 조사 시점, 조사 주체]
    equivalence_min_match: 4
    equivalence_rationale: "여섯 항목 중 네 개 이상이 맞아야 '동등 조사'로 본다. 4라는 값은 잠정값 — 근거 미확보."
    notes:
      - 동등성 점검 결과는 comparison_row 의 comparability·comparability_note 에 적는다.

  T:
    name: 기술·표준형
    mode: standard_tracking
    percent_based: false
    rationale: "기술·표준형 결론의 유효성은 수치 오차가 아니라 근거가 된 표준·규격이 그대로인지에 달려 있다. 표준이 개정되면 같은 수치라도 의미가 바뀌므로 표준 변경 여부를 1차 기준으로 둔다."
    states:
      - state: 표준·규격 무변경
        verdict: 동일
        next_action: 유지
        test: 인용한 표준 문서의 버전·릴리스·시험조건이 그대로다.
      - state: 개정판 발간(파라미터만 조정)
        verdict: 부분수정
        next_action: 부록 갱신
        test: 표준이 개정되었으나 결론의 방향은 유지되고 수치·조건만 바뀌었다.
      - state: 표준 대체·폐지
        verdict: 약화
        next_action: 재연구 발주
        test: 인용 표준이 다른 표준으로 대체되거나 폐지되었고, 결론이 그 표준에 의존한다.
      - state: 반대 결과를 담은 표준·시험결과 채택
        verdict: 뒤집힘
        next_action: 폐기(아카이브)
        test: 새 표준·공인 시험결과가 원 결론과 반대 방향을 규정한다.
      - state: 재실험 필요·추적 불가
        verdict: 판정불가
        next_action: 추가 조사(설계서)
        artifact: L3/experiment_plan_<K-ID>.md
        test: 표준 변경 여부를 확인할 수 없거나, 판정에 실측·재실험이 필요하다.
    notes:
      - 계산으로 확인 가능한 부분(링크버짓·간섭 여유 등)은 시뮬레이션으로 보조하되 C등급·"시뮬레이션"을 표기한다.

  B:
    name: 사례·동향형
    mode: case_validity_ratio
    metric: 유효 사례 비율 = (지금도 유효한 사례 수) / (원 보고서가 인용한 사례 수)
    valid_ratio_same: 0.8
    valid_ratio_partial: 0.5
    strengthen_rule: 유효 비율이 1.0이고 같은 방향의 신규 사례가 추가되면 강화.
    reverse_rule: 대표 사례(원 보고서가 근거로 삼은 핵심 사례)가 철회·실패·반대 방향으로 종료되면 뒤집힘.
    unavailable_verdict: 판정불가
    rationale: "사례 연구의 결론은 인용한 사례가 아직 살아 있는지에 달려 있으므로 유효 사례 비율로 잰다. 0.8·0.5라는 경계는 잠정값 — 근거 미확보."
    notes:
      - 사례별 현재 상태(유지·확대·축소·종료·전환)를 표로 남기고 각 줄에 출처를 붙인다.

  G:
    name: 기관전략형
    mode: kpi_attainment
    metric: KPI 달성도 = 실적 / 목표
    attainment_same: 0.9
    attainment_partial: 0.7
    strengthen_rule: 달성도 1.0 이상이고 전략이 확대·상향 개편되면 강화.
    reverse_rule: 해당 전략·사업이 폐지되었거나 반대 방향으로 개편되면 뒤집힘.
    unavailable_verdict: 판정불가
    unavailable_test: KPI 목표·실적이 공개 자료(경영공시·사업보고서·국회 제출자료)로 확인되지 않는다.
    rationale: "기관 전략은 실행 여부와 KPI 달성도로 잰다. 0.9·0.7 경계는 잠정값 — 근거 미확보(기관별 KPI 정의가 달라 공통 기준을 찾지 못했다)."
    notes:
      - KPI 정의가 중간에 바뀌었으면 달성도를 그대로 비교하지 말고 method_changed 를 참으로 두고 reason에 적는다.

# 결론에 types가 여러 개일 때의 처리
multi_type_rule:
  order: [P, T, S, M, F, B, G]
  rule: types 중 order 에서 앞선 유형의 기준을 먼저 적용하고, 다른 유형 기준이 더 낮은 판정을 주면 낮은 쪽을 택한다(보수적 판정).
  rationale: "상태 기준(P·T·S)은 수치 기준(M·F)보다 먼저 결론을 무효화할 수 있으므로 앞에 둔다. 유형이 섞인 결론에서 가장 나쁜 판정을 택하는 것은 '같은 결론이 다시 나오는가'라는 물음에 유리하게 답하지 않기 위해서다."

reason_locus: [P, E, M]      # 달라진 이유의 위치: 전제 / 근거 / 방법
blind_agreement:
  required_for_same: true    # "동일"은 블라인드 결론과도 방향이 일치해야 한다
  disagreement_downgrade: 부분수정
